<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kodland Sparks · Publish</title>
<script>
/* Language: ?lang=xx loads assets/content-xx.js (falls back to Portuguese, the base version) */
(function(){ var m = /[?&]lang=([a-z]{2}(?:-[A-Za-z]{2})?)/.exec(location.search); window.LANG = m ? m[1] : 'pt';
  document.write('<script src="assets/content-' + LANG + '.js"><\/script>'); })();
</script>
<script>if (!window.CONTENT){
  if (LANG !== 'pt') document.addEventListener('DOMContentLoaded', function(){ var b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#E5484D;color:#fff;font:600 14px/1.4 system-ui,sans-serif;padding:10px 16px;text-align:center';
    b.textContent = '⚠ assets/content-' + LANG + '.js could not be loaded (missing file or an error inside it). Showing the base version (content-pt.js) instead.'; document.body.appendChild(b); });
  window.LANG = 'pt'; document.write('<script src="assets/content-pt.js"><\/script>'); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Replica of the Kodland Sparks interface (light theme) + the guide layer (training palette) */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:#1d1f27;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column}
#scroller{flex:1;overflow:auto}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit}
.top{flex:0 0 auto;z-index:20;background:#fff;border-bottom:1px solid #eef0f3;display:flex;align-items:center;gap:14px;padding:10px 28px}
.brand b{font-size:17px;font-weight:800}.brand sup{font-size:11px;color:#888}.brand small{display:block;font-size:10.5px;color:#999}
.navl{display:flex;gap:6px;margin:0 auto;align-items:center}
.navl button{padding:8px 13px;border-radius:999px;font-weight:600;font-size:14.5px}
.navl button.cur,.navl button:hover{background:#f3f4f6}
.navl .studio{border:1.5px solid #8fb2f5;color:#3b73f0}
.navl .aih{background:#20b979;color:#fff;display:flex;gap:6px;align-items:center}
.navl .aih i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#2d5a3d,#9ad1a8);display:inline-block}
.navl .gems{background:#8b5cf6;color:#fff;font-weight:800;min-width:56px}
.av{width:34px;height:34px;border-radius:50%;background:#f59e0b;color:#fff;display:grid;place-items:center;font-weight:800}
.bell{width:34px;height:34px;border-radius:50%;border:1px solid #eee;display:grid;place-items:center}
main{max-width:1180px;margin:0 auto;padding:22px 28px 140px}
/* Studio */
.sbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sbar .pill{padding:8px 12px;border-radius:12px;background:#f3f6ff;color:#3b73f0;font-weight:600;font-size:14px}
.sbar .ic{width:36px;height:36px;border-radius:50%;border:1px solid #eee;display:grid;place-items:center}
.sbar .title{flex:0 1 260px;border:1px solid #e6e8ee;border-radius:999px;padding:9px 16px;font-size:14.5px;color:#1d1f27;min-width:180px;text-align:left}
.sbar .title.empty{color:#9aa0ab}
.sbar .sp{flex:1}
.sbar .ghost{border:1px solid #e6e8ee;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.sbar .pub{background:#3b82f6;color:#fff;border-radius:999px;padding:9px 18px;font-weight:700}
.stwrap{display:grid;grid-template-columns:150px 1fr;gap:16px}
.tools{border-right:1px solid #f0f0f0;padding-right:10px}
.tools h6{margin:10px 0 6px;font-size:10.5px;letter-spacing:.08em;color:#8a8f99}
.tools .row{display:flex;gap:6px;flex-wrap:wrap}
.tools .row span{width:30px;height:30px;border-radius:50%;border:1px solid #eee;display:grid;place-items:center;font-size:13px}
.tools .row span.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tools .sw{width:24px;height:24px;border-radius:50%;display:inline-block}
.canvas{background:#f7f8fa;border-radius:18px;display:grid;place-items:center;padding:20px;min-height:340px}
.frames{background:#f7f8fa;border-radius:18px;margin-top:12px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13px;color:#555}
.frames .fr{width:54px;height:54px;border:2px solid #3b82f6;border-radius:8px;overflow:hidden}
/* Form */
.form{max-width:680px;margin:0 auto;border:1px solid #e6e8ee;border-radius:22px;padding:22px 22px 26px}
.form h2{margin:0 0 4px;font-size:24px;font-weight:600}.form h2 span{color:#3b82f6}
.form .sub{color:#6b7080;margin:0 0 14px;font-size:14.5px}
.fl{font-weight:600;font-size:14.5px;margin:16px 0 6px;display:block}
.fi{width:100%;border:1px solid #e6e8ee;border-radius:12px;padding:10px 14px;font-size:14.5px;background:#fff}
.hint{font-size:12.5px;color:#6b7080;margin-top:5px}
.info{background:#f5f6f8;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#555;margin-top:14px}
.chipsr{display:flex;gap:8px;flex-wrap:wrap}
.chipsr span{border:1px solid #bbb;border-radius:999px;padding:7px 12px;font-size:14px}
.frcol{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.frcol span{border-radius:999px;padding:6px 12px;font-size:14px;color:#aaa}
.frcol span.def{border:1px solid #333;color:#111}
.vis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vis button{border:1px solid #d9e2f5;border-radius:14px;padding:12px;text-align:left;min-height:96px}
.vis button b{display:block;margin:6px 0 4px;font-size:14px}
.vis button small{font-size:12px;color:#6b7080;line-height:1.4;display:block}
.vis .pubv b,.vis .frv b{color:#3b73f0}
.vis button.sel{background:#eff5ff;border-color:#3b82f6}
.vis .mev.sel{background:#f3f3f3;border-color:#bbb}
.tg{display:flex;gap:14px;align-items:center;border:1px solid #eef0f3;border-radius:16px;padding:14px 16px;margin-top:12px;text-align:left;width:100%}
.tg div{flex:1}.tg b{display:block;font-weight:600;font-size:15px}.tg small{font-size:12.5px;color:#6b7080;line-height:1.45;display:block;margin-top:3px}
.tg i{width:46px;height:26px;border-radius:999px;background:#e9edf5;position:relative;flex:0 0 46px;transition:.2s}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.tg.on i{background:#3b82f6}.tg.on i::after{left:23px}
.tg.fb.on{background:#eefaf1;border-color:#3bb36a}.tg.fb.on i{background:#2f9d52}
.tg.dc.on{background:#f3f7ff;border-color:#8fb2f5}
.bigpub{width:100%;margin-top:18px;background:#8b5cf6;color:#fff;border-radius:999px;padding:13px;font-weight:800;font-size:16px}
.bigsave{width:100%;margin-top:18px;border:1px solid #e6e8ee;border-radius:999px;padding:12px;font-weight:600}
/* Project page */
.proj{max-width:820px;margin:0 auto}
.proj h1{font-size:28px;margin:0 0 14px}
.proj .img{border-radius:22px;overflow:hidden;background:#ec4899;display:grid;place-items:center;padding:20px}
.pacts{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pacts span,.pacts button{border:1px solid #eee;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.pacts .edit{background:#f1f1f3}
.pacts .pubtag{background:#eefaf1;border-color:#bfe8cc;color:#2f9d52}
.byline{display:flex;justify-content:space-between;color:#666;font-size:14px;align-items:center}
.byline span{display:flex;gap:8px;align-items:center}
.linkbox{margin-top:14px;display:flex;gap:8px;align-items:center;background:#f7f8fa;border-radius:12px;padding:10px 14px;font-size:13.5px;color:#444}
.linkbox code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Profile + feed cards */
.prof{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.prof .av{width:80px;height:80px;font-size:30px}
.prof h1{margin:0;font-size:26px}.prof small{color:#777}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{border:1px solid #ececec;border-radius:18px;overflow:hidden;text-align:left;background:#fff}
.pc .th{height:150px;position:relative;display:grid;place-items:center;overflow:hidden}
.pc .tags{position:absolute;left:8px;top:8px;display:flex;gap:6px}
.pc .tags span{background:#fff;border-radius:999px;font-size:11.5px;font-weight:700;padding:3px 8px}
.pc .bd{padding:10px 12px}
.pc .bd b{display:block;font-size:14px;margin-top:6px}
.pc .bd small{color:#666;font-size:12.5px}
.feedh{display:flex;align-items:center;gap:12px;margin:24px 0 12px;position:relative}
.feedh h2{margin:0;font-size:26px}
.dd{border:1px solid #ddd;border-radius:999px;padding:6px 16px;font-size:22px;font-weight:800}
.ddm{position:absolute;left:72px;top:46px;background:#fff;border:1px solid #e6e6e6;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:6px;z-index:5;min-width:170px}
.ddm button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:14.5px}
.ddm button:hover,.ddm button.cur{background:#f1f1f3}
.search{border:1px solid #eee;border-radius:999px;padding:10px 16px;color:#999;font-size:14px;margin-bottom:12px}
.code{font:11px/1.5 ui-monospace,monospace;color:#333;background:#fafafa;padding:22px 10px 6px;white-space:pre;width:100%;height:100%}
/* Guide layer */
#spot{position:fixed;z-index:40;pointer-events:none;border-radius:14px;box-shadow:0 0 0 4px #C4F046,0 0 0 9999px rgba(17,17,17,.35);display:none}
#coach{position:fixed;z-index:50;right:18px;bottom:18px;width:360px;max-width:calc(100vw - 36px);background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 0 2px #111;border-top:6px solid #C4F046;padding:16px 18px}
#coach .cs{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5E7F07}
#coach h4{margin:6px 0 6px;font-size:17px}
#coach .ct{font-size:14px;line-height:1.55;color:#3a4052}
#coach .ct ul{margin:6px 0;padding-left:18px}
#coach .cf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
#coach .hint{font-size:12.5px;color:#5E7F07;font-weight:700}
#coach .nx{background:#111;color:#fff;border-radius:999px;padding:9px 16px;font-weight:700}
#coach .nx:hover{background:#F03D9E}
#toast{position:fixed;z-index:60;top:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15);animation:tin .3s}
#toast .ok{background:#e8f8ee;color:#227a45;border:1px solid #bfe8cc}#toast .gem{background:#8b5cf6;color:#fff}#toast .no{background:#fff7e6;color:#7a4a00;border:1px solid #ffd68a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#intro,#end{position:fixed;inset:0;z-index:70;background:#E8FABD;display:none;overflow:auto}
.iw{max-width:760px;margin:0 auto;padding:46px 24px}
.ik{display:inline-block;background:#111;color:#C4F046;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:6px 14px}
.iw h1{font-size:38px;line-height:1.15;margin:16px 0 12px}.iw h1 span{background:#C4F046;padding:0 10px;border-radius:10px;box-shadow:0 0 0 2px #111 inset}
.iw p{font-size:16.5px;line-height:1.65;color:#3a3a3a}
.ib{background:#fff;border:2px solid #D8F07A;box-shadow:0 6px 0 #BFE15A;border-radius:18px;padding:18px 22px;margin:20px 0}
.ib h3{margin:0 0 8px}.ib ol,.ib ul{margin:0;padding-left:20px;line-height:1.7}
.ibtn{background:#111;color:#fff;border-radius:999px;padding:15px 30px;font-weight:800;font-size:16px}
.ibtn:hover{background:#F03D9E}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.stwrap{grid-template-columns:1fr}.tools{display:none}.vis{grid-template-columns:1fr}.navl button:not(.cur){display:none}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<div id="scroller"><main id="app"></main></div>
<div id="spot"></div>
<div id="coach"></div>
<div id="toast"></div>
<div id="intro"></div>
<div id="end"></div>
<script>
'use strict';
const T = CONTENT.ui, ST = CONTENT.steps;
document.documentElement.lang = CONTENT.lang;
document.title = T.title;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- Pixel art drawn by the student (. = pink, l = lavender, w = white) ---------- */
const ROBOT = ['......lll.......','......lwl.......','...llllllllww...','...l........w...','..ll.lw..lw.ww..','...l........w...','...l....lw..w...','...l........w...','...llllllwwww...','.......ll.......','....lllllwwww...','....l.......w...','...wl.......w...','...wllllllllw...','....l.ll.ll.....','....l.l.wl......','....l.l.wl......','....lll.wll.....'];
const HOUSE = ['.......yy.......','......yyyy......','.....yyyyyy.....','....yyyyyyyy....','...yyyyyyyyyy...','....bbbbbbbb....','....bwwbbwwb....','....bwwbbwwb....','....bbbbbbbb....','....bbbddbbb....','....bbbddbbb....','....bbbddbbb....','gggggggggggggggg','gggggggggggggggg'];
const COL = { '.':null, l:'#d8b4e2', w:'#ffffff', y:'#f59e0b', b:'#60a5fa', d:'#7c4a1e', g:'#22c55e' };
const pixel = (rows, bg, size) => { const w = rows[0].length, h = rows.length, c = size / Math.max(w, h);
  return `<svg width="${w * c}" height="${h * c}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" style="background:${bg}">${rows.map((r, y) => [...r].map((ch, x) => COL[ch] ? `<rect x="${x}" y="${y}" width="1" height="1" fill="${COL[ch]}"/>` : '').join('')).join('')}</svg>`; };

/* ---------- State ---------- */
const S = {
  screen:'studio', step:0, title:'', vis:'public', fb:false, promo:false, discord:true,
  formFor:'robot',                       // which project the form is editing
  robot:{ published:false, vis:null },
  house:{ vis:'me' },                    // Marina's project, saved for "Only me"
  filter:'Python', dd:false, gems:2, visSeen:{}
};

/* ---------- Guided steps: what to click (act) and where (target). Texts: CONTENT.steps[id] ---------- */
const STEPS = [
  { id:'start', next:true },
  { id:'title', act:'title', target:'#tTitle' },
  { id:'publish', act:'openForm', target:'#bPub' },
  { id:'form', next:true, target:'#fTop' },
  { id:'look', next:true, target:'#fLook' },
  { id:'visMe', act:'vis:me', target:'#vMe' },
  { id:'visFriends', act:'vis:friends', target:'#vFr' },
  { id:'visPublic', act:'vis:public', target:'#vPub' },
  { id:'feedback', act:'fb', target:'#tFb' },
  { id:'promo', next:true, target:'#tPromo' },
  { id:'send', act:'submit', target:'#bSubmit' },
  { id:'link', next:true, target:'#linkBox' },
  { id:'problem', next:true },
  { id:'myProjects', act:'nav:my', target:'#nMy' },
  { id:'privateCard', act:'open:house', target:'#cHouse' },
  { id:'edit', act:'edit', target:'#bEdit' },
  { id:'fixPublic', act:'vis:public', target:'#vPub' },
  { id:'resend', act:'submit', target:'#bSubmit' },
  { id:'feed', act:'nav:feed', target:'#nFeed' },
  { id:'filter', act:'dd', target:'#ddBtn' },
  { id:'image', act:'filter:Image', target:'#fImage' },
  { id:'found', next:true, target:'#cHouseFeed', last:true }
];

/* ---------- Screens ---------- */
function topbar(){
  const cur = S.screen === 'my' ? 'my' : S.screen === 'feed' ? 'feed' : S.screen === 'studio' ? 'studio' : '';
  $('#top').innerHTML = `<div class="brand"><b>Kodland Sparks</b><sup>α</sup><small>v0.10.6</small></div>
    <nav class="navl"><button id="nFeed" data-act="nav:feed" class="${cur === 'feed' ? 'cur' : ''}">Feed</button><button id="nMy" data-act="nav:my" class="${cur === 'my' ? 'cur' : ''}">My projects</button><button>Publish project</button><button class="studio">Studio</button><button class="aih"><i></i>AI helper</button><button class="gems">💎 ${S.gems}</button></nav>
    <span class="bell">🔔</span><span class="av">${T.studentInitial}</span>`;
}
const toolsHTML = () => `<div class="tools"><h6>DRAW</h6><div class="row"><span class="on">✎</span><span>⌫</span><span>🪣</span><span>💧</span></div>
  <h6>BRUSH SIZE</h6><div class="row"><span class="on">•</span><span>▪</span><span>■</span></div>
  <h6>CANVAS</h6><div class="row"><span>✋</span><span class="on">▦</span><span>≋</span></div>
  <h6>COLORS</h6><div class="row">${['#111', '#fff', '#0ea5e9', '#10b981', '#8b5cf6', '#ef4444', '#ec4899', '#d8b4e2'].map(c => `<i class="sw" style="background:${c};border:1px solid #ddd"></i>`).join('')}</div></div>`;
function studio(){
  return `<div class="sbar"><span>‹ My projects</span><span class="pill">🗂 Slot 1</span><span class="ic">💾</span><span class="ic">⤢</span>
    <button class="title ${S.title ? '' : 'empty'}" id="tTitle" data-act="title">${S.title || 'Project title'}</button><span class="sp"></span>
    <span class="ghost">＋ New project</span><span class="ic">⭱</span><span class="ic">⭳</span><button class="pub" id="bPub" data-act="openForm">Publish</button></div>
    <div class="stwrap">${toolsHTML()}<div><div class="canvas">${pixel(ROBOT, '#ec4899', 300)}</div>
    <div class="frames">▷ Speed <b>6</b><span class="fr">${pixel(ROBOT, '#ec4899', 50)}</span></div></div></div>`;
}
function form(){
  const editing = S.formFor === 'house', title = editing ? T.houseTitle : S.title;
  const pub = S.vis === 'public', me = S.vis === 'me';
  return `<div class="form"><div id="fTop"><h2>${editing ? 'Edit' : 'New'} <span>project</span></h2><p class="sub">Pick a project type, fill in the details, and choose who can see it.</p>
    <label class="fl">Title</label><div class="fi">${title}</div><div class="hint">${30 - title.length} characters left</div>
    <label class="fl">Description</label><div class="fi" style="min-height:62px;color:#9aa0ab">${editing ? T.houseDesc : ''}</div><div class="hint">240 characters left</div>
    <div class="info">The image comes from your pixel art — animations are saved as APNG, single frames as PNG.</div>
    <label class="fl">📁 Section</label><div class="fi">No section ▾</div><div class="hint">Sections help group your projects on your profile page.</div></div>
    <div id="fLook"><label class="fl">Reactions</label><div class="hint" style="margin:-2px 0 8px">Pick which reactions viewers can leave on this project.</div>
    <div class="chipsr"><span>💖 Heart is always available</span><span>👍</span><span>😁</span><span>🔥</span><span>💀</span><span>🦄</span></div>
    <label class="fl">Appearance</label><div class="hint" style="margin:-2px 0 4px">Choose a frame color to highlight your project card in the feed.</div>
    <div class="frcol"><span class="def">● Default</span><span>🔒 Sky</span><span>🔒 Emerald</span><span>🔒 Violet</span><span>🔒 Red</span></div></div>
    <label class="fl">Visibility</label>
    <div class="vis"><button id="vPub" class="pubv ${pub ? 'sel' : ''}" data-act="vis:public">🌐<b>Public</b><small>Appears in the feed and on your public portfolio.</small></button>
      <button id="vFr" class="frv ${S.vis === 'friends' ? 'sel' : ''}" data-act="vis:friends">👥<b>Friends only</b><small>Visible to your friends, your teachers, and you.</small></button>
      <button id="vMe" class="mev ${me ? 'sel' : ''}" data-act="vis:me">🙈<b>Only me</b><small>Visible only to you on your portfolio.</small></button></div>
    ${me ? '' : `<button class="tg fb ${S.fb ? 'on' : ''}" id="tFb" data-act="fb"><div><b>Request feedback</b><small>Other authors will be able to leave structured feedback on your project. Available for public projects only.</small></div><i></i></button>`}
    <button class="tg ${S.promo ? 'on' : ''}" id="tPromo"><div><b>I'm OK with Kodland Sparks using this project in promotions</b><small>For example, it might appear in our social media, ads, or on the main page to show other kids what's possible here. You can change this anytime.</small></div><i></i></button>
    ${pub ? `<button class="tg dc ${S.discord ? 'on' : ''}" id="tDc"><div><b>Take part in the Discord selection</b><small>Once a day we post the day's best projects to our Discord server. Keep this on and yours can be picked too. Public projects only.</small></div><i></i></button>` : ''}
    ${me ? `<button class="bigsave" id="bSubmit" data-act="submit">Save</button>` : `<button class="bigpub" id="bSubmit" data-act="submit">1× 💎 Publish</button>`}</div>`;
}
function project(which){
  const robot = which === 'robot', vis = robot ? S.robot.vis : S.house.vis, priv = vis === 'me';
  const slug = robot ? 'cmrobo7x01sparks' : 'cmhouse4q02sparks';
  return `<div class="proj"><h1>${robot ? S.title : T.houseTitle}</h1>
    <div class="img" style="background:${robot ? '#ec4899' : '#bfe3ff'}">${robot ? pixel(ROBOT, '#ec4899', 280) : pixel(HOUSE, '#bfe3ff', 260)}</div>
    <div class="pacts">${priv ? '<span>Private project</span>' : '<span class="pubtag">🌐 Public</span>'}<span>⭳ Download</span><button class="edit" id="bEdit" data-act="edit">✎ Edit</button></div>
    <div class="byline"><span><i class="av" style="width:30px;height:30px;font-size:13px">${robot ? T.studentInitial : 'M'}</i><b>${robot ? T.studentNick : T.houseNick}</b></span><span>Uploaded Oct 21, 2026</span></div>
    <div class="linkbox" id="linkBox">🔗 <code>https://portfolio.kodland.org/${robot ? T.studentNick : T.houseNick}/${slug}</code><b>${priv ? '🔒' : '⧉ Copy'}</b></div></div>`;
}
const card = (id, title, rowsBg, tags, by, act) => `<button class="pc" id="${id}" ${act ? `data-act="${act}"` : ''}><div class="th" style="background:${rowsBg[1]}">${pixel(rowsBg[0], rowsBg[1], 130)}<div class="tags">${tags.map(t => `<span>${t}</span>`).join('')}</div></div><div class="bd"><small>💖 0 ☺</small><b>${title}</b><small>${by}</small></div></button>`;
function my(){
  return `<div class="prof"><span class="av">M</span><div><h1>${T.houseNick}</h1><small>${T.houseName}</small></div></div>
    <div class="grid">${card('cHouse', T.houseTitle, [HOUSE, '#bfe3ff'], S.house.vis === 'me' ? ['PNG', 'Private project'] : ['PNG'], '', 'open:house')}
      ${card('cOld', T.houseOld, [ROBOT, '#a78bfa'], ['PNG', 'Private project'], '')}</div>`;
}
function feed(){
  const codeCard = (t, by) => `<div class="pc"><div class="th" style="background:#fafafa"><div class="code">for i in range(6):\n    z = i * 8\n    execute(f"fill ~5 ~{z}")</div><div class="tags"><span>Python</span></div></div><div class="bd"><small>💖 0 ☺</small><b>${t}</b><small>${by}</small></div></div>`;
  const types = ['All projects', 'Image', 'Python', 'GitHub', 'Video', '3D', 'Canva', 'Scratch'];
  const image = S.filter === 'Image';
  return `<h2 style="font-size:26px;margin:4px 0 12px">Latest Featured Projects</h2>
    <div class="grid">${card('', 'Flappy Bird', [ROBOT, '#1e3a5f'], ['Web App'], 'samueldavid')}${card('', 'collect.mp3', [HOUSE, '#e0f2fe'], ['Music'], 'dylanlopera')}${card('', 'Primer juego', [ROBOT, '#111827'], ['Web App'], 'santiago43')}${card('', 'avatar legal azul', [HOUSE, '#e5e7eb'], ['Skin'], 'gabriel30365')}</div>
    <div class="feedh"><h2>Feed</h2><button class="dd" id="ddBtn" data-act="dd">${S.filter} ▾</button><span style="color:#777">(${image ? 656 : 291} results)</span>
      ${S.dd ? `<div class="ddm">${types.map(x => `<button id="${x === 'Image' ? 'fImage' : ''}" data-act="filter:${x}" class="${x === S.filter ? 'cur' : ''}">${x}${x === S.filter ? ' ✓' : ''}</button>`).join('')}</div>` : ''}</div>
    <div class="search">🔍 Nickname or project title...</div>
    <div class="grid">${image ? card('cHouseFeed', T.houseTitle, [HOUSE, '#bfe3ff'], ['PNG'], T.houseNick) + card('', 'pixel art', [ROBOT, '#ec4899'], ['PNG'], T.studentNick) + card('', 'Block dash', [ROBOT, '#111'], ['PNG'], 'ethan47210') + card('', 'Bestia de Lava', [HOUSE, '#fde68a'], ['GIF'], 'lioneljere')
      : codeCard('script import', 'mateo.dev') + codeCard('El perro', 'lucia_22') + codeCard('Torre', 'gabi.py') + codeCard('Castillo', 'tomas09')}</div>`;
}
function render(){
  topbar();
  $('#scroller').scrollTop = 0;
  $('#app').innerHTML = S.screen === 'studio' ? studio() : S.screen === 'form' ? form() : S.screen === 'robot' ? project('robot') : S.screen === 'house' ? project('house') : S.screen === 'my' ? my() : feed();
  coach();
}

/* ---------- Guide card ---------- */
function coach(){
  const st = STEPS[S.step], tx = ST[st.id], c = $('#coach');
  c.innerHTML = `<div class="cs">${T.coachStep(S.step + 1, STEPS.length)}</div><h4>${tx.title}</h4><div class="ct">${tx.text}</div>
    <div class="cf">${st.next ? `<span></span><button class="nx" id="cNext">${st.last ? T.finish : T.next}</button>` : `<span class="hint">${T.clickHint}</span>`}</div>`;
  const nb = $('#cNext'); if (nb) nb.onclick = () => st.last ? finish() : advance();
  placeSpot();
}
function placeSpot(){
  const st = STEPS[S.step], t = st.target ? $(st.target) : null, sp = $('#spot');
  if (!t){ sp.style.display = 'none'; return; }
  t.scrollIntoView({ block:'center' });
  requestAnimationFrame(() => { const r = t.getBoundingClientRect(), p = 6;
    Object.assign(sp.style, { display:'block', left:(r.left - p) + 'px', top:(r.top - p) + 'px', width:(r.width + p * 2) + 'px', height:(r.height + p * 2) + 'px' }); });
}
addEventListener('resize', placeSpot);
// Keep the highlight on its element (images and fonts can move the layout after a render)
setInterval(() => { const st = STEPS[S.step], t = st && st.target ? $(st.target) : null, sp = $('#spot'); if (!t || sp.style.display === 'none') return; const r = t.getBoundingClientRect(), p = 6; Object.assign(sp.style, { left:(r.left - p) + 'px', top:(r.top - p) + 'px', width:(r.width + p * 2) + 'px', height:(r.height + p * 2) + 'px' }); }, 250);
addEventListener('scroll', () => requestAnimationFrame(() => { const st = STEPS[S.step], t = st && st.target ? $(st.target) : null, sp = $('#spot'); if (!t) return; const r = t.getBoundingClientRect(), p = 6; Object.assign(sp.style, { left:(r.left - p) + 'px', top:(r.top - p) + 'px' }); }), true);
function toast(items){ const b = $('#toast'); b.innerHTML = items.map(x => `<div class="${x[0]}">${x[1]}</div>`).join(''); clearTimeout(toast.t); toast.t = setTimeout(() => b.innerHTML = '', 2600); }
function advance(){ S.step++; render(); }

/* ---------- Actions: the platform reacts, and the guide moves on when it's the expected click ---------- */
function perform(act){
  const [a, arg] = act.split(':');
  if (a === 'title') S.title = T.robotTitle;
  else if (a === 'openForm'){ S.formFor = 'robot'; S.vis = 'public'; S.fb = false; S.screen = 'form'; }
  else if (a === 'vis') S.vis = arg;
  else if (a === 'fb') S.fb = !S.fb;
  else if (a === 'submit'){
    if (S.formFor === 'robot'){ S.robot = { published:true, vis:S.vis }; S.screen = 'robot'; S.gems++; toast([['ok', '✓ Saved'], ['gem', 'Earned 1× 💎']]); }
    else { S.house.vis = S.vis; S.screen = 'house'; toast([['ok', '✓ Saved']]); }
  }
  else if (a === 'nav'){ S.screen = arg; S.dd = false; }
  else if (a === 'open') S.screen = arg;
  else if (a === 'edit'){ S.formFor = S.screen === 'house' ? 'house' : 'robot'; S.vis = S.screen === 'house' ? S.house.vis : S.robot.vis; S.fb = false; S.screen = 'form'; }
  else if (a === 'dd') S.dd = !S.dd;
  else if (a === 'filter'){ S.filter = arg; S.dd = false; }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !$('#app, #top') ) return;
  if (!e.target.closest('#app') && !e.target.closest('#top')) return;
  const st = STEPS[S.step];
  if (st.act && el.dataset.act === st.act){ perform(st.act); S.step++; render(); return; }
  toast([['no', T.followStep]]);
  placeSpot();
});

/* ---------- Welcome and final screens ---------- */
function intro(){
  const w = CONTENT.welcome, el = $('#intro');
  el.innerHTML = `<div class="iw"><span class="ik">${w.kicker}</span><h1>${w.title}</h1><p>${w.lead}</p>
    <div class="ib"><h3>${w.seeTitle}</h3><ol>${w.see.map(x => `<li>${x}</li>`).join('')}</ol></div>
    <p>${w.how}</p><button class="ibtn" id="iStart">${w.start}</button></div>`;
  el.style.display = 'block';
  $('#iStart').onclick = () => { el.style.display = 'none'; render(); };
}
function finish(){
  const f = CONTENT.finish, el = $('#end');
  $('#coach').style.display = 'none'; $('#spot').style.display = 'none';
  el.innerHTML = `<div class="iw"><span class="ik">${f.kicker}</span><h1>${f.title}</h1><p>${f.intro}</p>
    <div class="ib"><ul>${f.points.map(x => `<li>${x}</li>`).join('')}</ul></div>
    <p>${f.back}</p><button class="ibtn" id="eAgain">${f.again}</button></div>`;
  el.style.display = 'block';
  $('#eAgain').onclick = () => location.reload();
  // Tell the training that the simulation is complete (inside the page, or in another tab)
  const msg = { type:'em-sim-done', sim:'sparksPublish' };
  try { if (parent !== window) parent.postMessage(msg, '*'); } catch(e){}
  try { if (opener) opener.postMessage(msg, '*'); } catch(e){}
}

render();
intro();
</script>
</body>
</html>
